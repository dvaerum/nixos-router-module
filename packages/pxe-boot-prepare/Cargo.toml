[package]
name = "pxe-boot-prepare"
version = "0.1.1"
edition = "2021"

[dependencies]
# Async runtime
tokio = { version = "1.53", features = ["full"] }
futures = "0.3"

# CLI
clap = { version = "4.6", features = ["derive"] }

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Error handling
thiserror = "2.0"
anyhow = "1.0"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

# File system
walkdir = "2.5"
tempfile = "3.27"

# Templating
handlebars = "6.4"

# Async traits
async-trait = "0.1"
percent-encoding = "2.3.2"
fs4 = { version = "1.1.0", features = ["tokio"] }

[dev-dependencies]
tokio-test = "0.4"

[features]
default = []
